[package]
name = "overtone-cli"
description = "Manage your Overtone DJ library, audio quality checks, and DJ crates from the terminal"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository = "https://github.com/JacksonFergusonDev/overtone"

[[bin]]
name = "overtone-cli"
path = "src/main.rs"

[dependencies]
clap = { workspace = true, features = ["env"] }
comfy-table.workspace = true
indicatif.workspace = true
overtone-audio.workspace = true
overtone-core.workspace = true
overtone-sync-serato.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
overtone-sync-rekordbox = { workspace = true, features = ["fixture"] }
overtone-testkit.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
