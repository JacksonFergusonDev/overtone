[package]
name = "overtone-app"
description = "Overtone desktop app"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "Overtone"
path = "src/main.rs"

[lib]
# The `_lib` suffix avoids a name clash with the bin target on Windows (cargo#8519).
name = "overtone_app_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
overtone-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
ts-rs.workspace = true

[dev-dependencies]
tempfile.workspace = true
tauri = { version = "2", features = ["protocol-asset", "test"] }

[lints]
workspace = true
